[project]
name = "hopfield-rl"
version = "0.1.0"
description = "Controlled memory and delayed-reward tasks for Hopfield RL"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gymnasium>=1.2,<2",
    "numpy>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
